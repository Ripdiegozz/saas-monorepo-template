# Development compose - hot reload for web and server
# Hot reload uses polling (nodemon -L, webpack watchOptions.poll) so it works
# reliably in Docker on both Unix and Windows (WSL2 bind mounts don't propagate inotify).
services:
  postgres:
    image: postgres:16-alpine
    container_name: saas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - migrate_node_modules:/app/node_modules
      - migrate_pnpm_store:/app/.pnpm-store
    command: sh -c "corepack enable pnpm && pnpm install --config.confirmModulesPurge=false && pnpm --filter @workspace/db db:push"
    environment:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NO_UPDATE_NOTIFIER: "1"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/saas
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      # Isolate node_modules/store - avoids ENOENT when host (Windows) mount conflicts with container (Linux)
      - server_node_modules:/app/node_modules
      - server_pnpm_store:/app/.pnpm-store
    command: sh -c "corepack enable pnpm && pnpm install --config.confirmModulesPurge=false && pnpm --filter server dev"
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NO_UPDATE_NOTIFIER: "1"
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/saas
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-at-least-32-characters-long-for-better-auth}
      BETTER_AUTH_URL: http://localhost:4000
      BETTER_AUTH_TRUSTED_ORIGINS: http://localhost:3000
      APP_URL: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_pnpm_store:/app/.pnpm-store
    command: sh -c "corepack enable pnpm && pnpm install --config.confirmModulesPurge=false && pnpm --filter web exec next dev --webpack"
    ports:
      - "3000:3000"
    environment:
      CI: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NO_UPDATE_NOTIFIER: "1"
      # Hot reload in Docker (Windows/WSL2/Unix): polling instead of inotify
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  postgres_data:
  migrate_node_modules:
  migrate_pnpm_store:
  server_node_modules:
  server_pnpm_store:
  web_node_modules:
  web_pnpm_store:
